image:
  repository: ""
  pullPolicy: IfNotPresent
  tag: ""

serviceAccount:
  annotations: {}

# Rules are bound to the ServiceAccount created by this chart.
rbac:
  role:
    rules: []
  clusterRole:
    rules: []

podLabels: {}
podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

hostNetwork: false

ports: []
# - name: ""
#   containerPort: 0
#   protocol: TCP

service:
  type: ClusterIP
  externalTrafficPolicy: ""
  loadBalancerIP: ""
  loadBalancerClass: ""

# Additional Services select the same pods without exposing these ports on the
# main Service. Port ranges are inclusive and use the same port on the pod.
additionalServices: []
# - name: printer
#   type: LoadBalancer
#   loadBalancerClass: metallb
#   loadBalancerIP: 192.168.0.251
#   externalTrafficPolicy: Cluster
#   ports:
#     - name: mqtt
#       port: 8883
#       targetPort: 8883 # Optional; defaults to port.
#       protocol: TCP # Optional; defaults to TCP.
#   portRanges:
#     - name: ftp # Prefix; <name>-<port> must fit in 15 characters.
#       start: 50000
#       end: 50100
#       protocol: TCP # Optional; defaults to TCP.

health:
  enabled: true
  startupProbeSeconds: 60
  port: main
  type: HTTP
  path: /
  httpHeaders: []
  # - name: Host
  #   value: example.com

gateway:
  host: ""
  path: /
  public: false
  publicPath: /
  port: main
  publicRules: {}

oidc:
  clientId: ""
  clientSecret: ""
  # Optional cluster-wide SealedSecret ciphertext, never a plaintext API key.
  # Requests with X-API-Key use API-key authentication instead of OIDC.
  apiKey: ""

replicas: 1
strategyType: Recreate

resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector: {}

terminationGracePeriodSeconds: 30

command: []

args: []

envs: []
# - PLAIN_VALUE: example
# - POD_IP:
#     valueFrom:
#       fieldRef:
#         fieldPath: status.podIP
# Define referenced variables in earlier list entries for $(NAME) expansion.

secretEnvs: []

configMaps: []
# - name: ""
#   defaultMode: 0644
#   mountPath: ""
#   subPath: ""
#   content: ""

hostPaths: []
# - name: ""
#   hostPath: ""
#   containerPath: ""
#   readOnly: false
#   type: "DirectoryOrCreate"

emptyDirs: []

# - name: ""
#   containerPath: ""

initContainers: []

