image:
  repository: "ghcr.io/skaronator/cmst-dl"
  tag: "0.0.0-snapshot-dd77f39-amd64@sha256:ac7bd1166705bf828a46d00c9d136fab7405eb726b243745d685e8b9df3724e4"

securityContext:
  runAsUser: 5000
  runAsGroup: 5000

replicas: 0

ports:
  - name: main
    containerPort: 8080

health:
  path: /health

gateway:
  host: cmst-dl.wagner.gg

hostPaths:
  - name: data
    hostPath: /srv/nvme/container-data/cmst-dl
    containerPath: /data
  - name: downloads
    hostPath: /srv/hdd/pp/cmst-dl
    containerPath: /downloads

homepage:
  name: cmst-dl
  group: Downloads
  description: CMST Download Client
  icon: synology-download-station.png
  weight: 6

envs:
  - CMST_KINDS: video
  - CMST_VIDEO_MIN_DURATION: 5m

secretEnvs:
  - CMST_USERNAME: 
  - CMST_PASSWORD: 
