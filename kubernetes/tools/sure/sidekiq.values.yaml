image:
  repository: "ghcr.io/we-promise/sure"
  tag: "0.7.4-alpha.2"

hostPaths:
  - name: data
    hostPath: /srv/nvme/container-data/sure
    containerPath: /rails/storage

health:
  enabled: false

args:
  - bundle
  - exec
  - sidekiq

envs:
  - REDIS_URL: redis://sure-redis:6379
  - DB_HOST: sure-db
  - DB_PORT: 5432
  - POSTGRES_USER: sure
  - POSTGRES_PASSWORD: $(TEMPLATE_DB_PASSWORD)
  - POSTGRES_DB: sure
  - SELF_HOSTED: "true"
  - RAILS_FORCE_SSL: "false"
  - RAILS_ASSUME_SSL: "false"

secretEnvs:
  - SECRET_KEY_BASE: 
  - POSTGRES_PASSWORD: 
