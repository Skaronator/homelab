image:
  repository: "ghcr.io/we-promise/sure"
  tag: "0.7.5-alpha.2@sha256:c4043ecc77b9d32cc8f0b602d1785f1fbc26a50587c3fd9f67e51ff9228fedfe"

hostPaths:
  - name: data
    hostPath: /srv/nvme/container-data/sure
    containerPath: /rails/storage

ports:
  - name: main
    containerPort: 3000

health:
  path: /up

gateway:
  host: sure.wagner.gg

database:
  enabled: true
  type: postgresql
  hostPath: /srv/nvme/container-data/sure-db
  rootPassword: 

envs:
  - REDIS_URL: redis://sure-redis:6379
  - DB_HOST: $(TEMPLATE_DB_HOST)
  - DB_PORT: $(TEMPLATE_DB_PORT)
  - POSTGRES_USER: $(TEMPLATE_DB_USERNAME)
  - POSTGRES_PASSWORD: $(TEMPLATE_DB_PASSWORD)
  - POSTGRES_DB: $(TEMPLATE_DB_DATABASE)
  - SELF_HOSTED: true
  - RAILS_FORCE_SSL: false
  - RAILS_ASSUME_SSL: false
  - AUTH_LOCAL_LOGIN_ENABLED: false
  - OIDC_ISSUER: https://id.wagner.gg
  - OIDC_CLIENT_ID: 39704c91-f38f-412a-a706-30a816876d7b
  - OIDC_REDIRECT_URI: https://sure.wagner.gg/auth/openid_connect/callback
  - OIDC_BUTTON_LABEL: Sign in with Pocket ID
  - AUTH_PROVIDERS_SOURCE: yaml

secretEnvs:
  - SECRET_KEY_BASE: 
  - OIDC_CLIENT_SECRET: 

homepage:
  name: Sure
  group: Personal & Finance
  description: Personal Finance Manager
  icon: sure
  weight: 4
