apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmGlobals:
  chartHome: ../../../helm-charts

helmCharts:
  - name: generic-service
    releaseName: sure
    valuesFile: values.yaml
    namespace: tools
  - name: generic-service
    releaseName: sure-redis
    valuesFile: redis.values.yaml
    namespace: tools
  - name: generic-service
    releaseName: sure-sidekiq
    valuesFile: sidekiq.values.yaml
    namespace: tools
