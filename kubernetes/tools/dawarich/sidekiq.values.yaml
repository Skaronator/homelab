image:
  repository: "freikin/dawarich"
  tag: "1.14.4@sha256:2fecbaf093b9544b5733fe972d422100c2bc5be896e706c58eab8bdb6860fe06"

hostPaths:
  - name: public
    hostPath: /srv/nvme/container-data/dawarich-public
    containerPath: /var/app/public
  - name: storage
    hostPath: /srv/nvme/container-data/dawarich-storage
    containerPath: /var/app/storage

health:
  enabled: false

command:
  - sidekiq-entrypoint.sh

args:
  - bundle
  - exec
  - sidekiq

envs:
  - REDIS_URL: redis://dawarich-redis:6379
  - DATABASE_HOST: dawarich-db
  - DATABASE_PORT: 5432
  - DATABASE_USERNAME: dawarich
  - DATABASE_NAME: dawarich
  - PHOTON_API_HOST: app.chibigeo.com/v1/photon
  - PHOTON_API_USE_HTTPS: true

secretEnvs:
  - SECRET_KEY_BASE: 
  - DATABASE_PASSWORD: 
  - PHOTON_API_KEY: 
