image:
  repository: "freikin/dawarich"
  tag: "1.14.0@sha256:f251f08d6330a9b22506c862407e53b0b4aec620a63953a446e19cd610d7d476"

hostPaths:
  - name: public
    hostPath: /srv/nvme/container-data/dawarich-public
    containerPath: /var/app/public
  - name: storage
    hostPath: /srv/nvme/container-data/dawarich-storage
    containerPath: /var/app/storage

ports:
  - name: main
    containerPort: 3000

health:
  path: /api/v1/health

gateway:
  host: dawarich.wagner.gg

database:
  enabled: true
  type: postgresql
  hostPath: /srv/nvme/container-data/dawarich-db
  rootPassword: 
  postgresql:
    image:
      repository: "postgis/postgis"
      tag: "17-3.5-alpine@sha256:894f570c0cf0664ed5576a8fd5d5bfb8fb1b19d592885b686c3a88c8bd90c41f"

envs:
  - RAILS_ENV: production
  - REDIS_URL: redis://dawarich-redis:6379
  - DATABASE_HOST: $(TEMPLATE_DB_HOST)
  - DATABASE_PORT: $(TEMPLATE_DB_PORT)
  - DATABASE_USERNAME: $(TEMPLATE_DB_USERNAME)
  - DATABASE_PASSWORD: $(TEMPLATE_DB_PASSWORD)
  - DATABASE_NAME: $(TEMPLATE_DB_DATABASE)
  - MIN_MINUTES_SPENT_IN_CITY: 60
  - TIME_ZONE: $(TZ)
  - APPLICATION_PROTOCOL: http
  - RAILS_LOG_TO_STDOUT: true
  - STORE_GEODATA: true
  - APPLICATION_HOST: localhost,127.0.0.1,10.0.0.0,0.0.0.0
  - APPLICATION_HOSTS: localhost,dawarich.wagner.gg,0.0.0.0
  - OIDC_CLIENT_ID: e964f68a-63a4-49e0-9fa3-adab08f82d97
  - OIDC_ISSUER: https://id.wagner.gg/.well-known/openid-configuration
  - OIDC_REDIRECT_URI: https://dawarich.wagner.gg/users/auth/openid_connect/callback
  - OIDC_PROVIDER_NAME: Pocket ID
  - OIDC_PKCE_ENABLED: true
  - ALLOW_EMAIL_PASSWORD_REGISTRATION: false
  - ALLOW_EMAIL_PASSWORD_LOGIN: false
  - SMTP_SERVER: smtp.migadu.com
  - SMTP_PORT: 587
  - SMTP_DOMAIN: wagner.gg
  - SMTP_STARTTLS: true

secretEnvs:
  - SECRET_KEY_BASE: 
  - OIDC_CLIENT_SECRET: 
  - SMTP_FROM: 
  - SMTP_USERNAME: 
  - SMTP_PASSWORD: 

command: 
  - web-entrypoint.sh

args:
  - bin/rails
  - server
  - -p
  - 3000
  - -b
  - "::"

homepage:
  name: Dawarich
  group: Home & Utilities
  description: Da war ich wirklich!
  icon: dawarich.svg
  weight: 3
