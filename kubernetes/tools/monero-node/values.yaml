image:
  repository: "ghcr.io/sethforprivacy/simple-monerod"
  tag: "v0.18.5.4@sha256:0c0b9b0fd35507e5c5c843732c433657f4a64b6d7c1cc709807fed45d7e8c024"

args:
  - --rpc-restricted-bind-ip=0.0.0.0
  - --rpc-restricted-bind-port=18089
  - --no-igd
  - --no-zmq

hostPaths:
  - name: data
    hostPath: /srv/nvme/scrap-data/monero
    containerPath: /home/monero/.bitmonero

ports:
  - name: main
    containerPort: 18089
  - name: p2p
    containerPort: 18080

gateway:
  host: monero.wagner.gg

health:
  path: /get_height

securityContext:
  runAsUser: 5000
