apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmGlobals:
  chartHome: ../../../helm-charts

helmCharts:
  - name: generic-service
    releaseName: zrepl
    valuesFile: values.yaml
    namespace: storage

# A character-device mount does not need the chart's root storage preparation.
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: zrepl
    patch: |-
      - op: remove
        path: /spec/template/spec/initContainers
