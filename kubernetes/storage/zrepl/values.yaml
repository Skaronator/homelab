image:
  repository: "ghcr.io/tuxcrate/zrepl"
  tag: "0.7.0-r21@sha256:983ba8fff28a17319d109a8fba008f9217d868843856e3ee64b30a341bbc8b24"

# Delegate snapshot and destroy permissions to host UID 1000 for the selected datasets.
securityContext:
  runAsUser: 1000
  runAsGroup: 1000
  runAsNonRoot: true
  privileged: true

hostPaths:
  - name: zfs
    hostPath: /dev/zfs
    containerPath: /dev/zfs
    type: CharDevice

configMaps:
  - name: config
    mountPath: /etc/zrepl
    subPath: zrepl.yml
    content:
      global:
        logging:
          - format: human
            level: info
            type: stdout
      jobs:
        - filesystems:
            hdd<: true
            # except root, backup and multimedia
            hdd: false
            hdd/backup: false
            hdd/multimedia: false
            # backup everything from nvme
            nvme<: true
            # except root and scrap-data
            nvme: false
            nvme/scrap-data: false
          name: longterm
          pruning:
            keep:
              - grid: 1x24h(keep=all) | 14x1d | 3x30d
                regex: ^longterm_.*$
                type: grid
          snapshotting:
            cron: 0 * * * *
            prefix: longterm_
            type: cron
          type: snap
        - filesystems:
            # backup everything from zroot
            zroot<: true
            # except root and backup
            zroot: false
            hdd/multimedia: true
          name: midterm
          pruning:
            keep:
              - grid: 1x24h(keep=all) | 14x1d
                regex: ^midterm_.*$
                type: grid
          snapshotting:
            cron: 0 * * * *
            prefix: midterm_
            type: cron
          type: snap
        - filesystems:
            # Backup everything from downloads
            downloads<: true
            # except root volume
            downloads: false
            hdd/backup: true
            nvme/scrap-data: true
          name: shortterm
          pruning:
            keep:
              - grid: 1x24h(keep=all) | 3x1d
                regex: ^shortterm_.*$
                type: grid
          snapshotting:
            cron: 0 * * * *
            prefix: shortterm_
            type: cron
          type: snap
