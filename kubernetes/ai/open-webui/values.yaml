image:
  repository: "ghcr.io/open-webui/open-webui"
  tag: "v0.11.4"

ports:
  - name: main
    containerPort: 3000

health:
  path: /

gateway:
  host: chat.wagner.gg

hostPaths:
  - name: data
    hostPath: /srv/nvme/container-data/open-webui
    containerPath: /app/backend/data

envs:
  - ENABLE_OAUTH_SIGNUP: true
  - OAUTH_CLIENT_ID: 4e54cd8f-f2f7-476c-9b01-8c53495eea10
  - OAUTH_PROVIDER_NAME: Pocket ID
  - OPENID_PROVIDER_URL: https://id.wagner.gg/.well-known/openid-configuration
  - OAUTH_MERGE_ACCOUNTS_BY_EMAIL: true
  - ENABLE_OAUTH_ROLE_MANAGEMENT: true
  - ENABLE_OAUTH_GROUP_MANAGEMENT: true
  - ENABLE_OAUTH_GROUP_CREATION: true
  - OAUTH_ALLOWED_ROLES: niklas
  - OAUTH_ADMIN_ROLES: niklas
  - OAUTH_ROLES_CLAIM: groups
  - OAUTH_SCOPES: openid email profile groups
  - DEFAULT_USER_ROLE: user
  - ENABLE_LOGIN_FORM: false
  - OAUTH_UPDATE_PICTURE_ON_LOGIN: true

secretEnvs:
  - OAUTH_CLIENT_SECRET: 

homepage:
  name: Open WebUI
  group: Home & Utilities
  description: LLM Chat Interface
  icon: open-webui.svg
  weight: 1
