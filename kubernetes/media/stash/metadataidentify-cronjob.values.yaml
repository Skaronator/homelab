schedule: "0 4 * * *"

envs:
  - GRAPHQL_QUERY: >
      mutation {
        metadataIdentify(input: {
          sources: [
            { source: { stash_box_endpoint: \"https://stashdb.org/graphql\" } }
            { source: { stash_box_endpoint: \"https://theporndb.net/graphql\" } }
            { source: { stash_box_endpoint: \"https://pmvstash.org/graphql\" } }
            { source: { stash_box_endpoint: \"https://fansdb.cc/graphql\" } }
          ]
          options: {
            fieldOptions: [
              { field: \"title\", strategy: MERGE, createMissing: null }
              { field: \"studio\", strategy: MERGE, createMissing: true }
              { field: \"tags\", strategy: MERGE, createMissing: true }
              { field: \"performers\", strategy: MERGE, createMissing: true }
            ]
            setCoverImage: true
            setOrganized: true
            performerGenders: []
            skipMultipleMatches: true
            skipMultipleMatchTag: null
            skipSingleNamePerformers: true
            skipSingleNamePerformerTag: null
          }
          paths: []
        })
      }
